name: Check Apna Khata

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Check code, run tests and build
        run: npm run check
